<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e14" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./theme.css" />
    <title>C-17 Mission Planner</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <img class="logo" src="./icon.svg" alt="" />
        <div>
          <h1>C-17 MISSION PLANNER</h1>
          <div class="subtitle">Weather · NOTAMs · Hazards · Wind &amp; Pattern Analysis</div>
        </div>
        <div class="spacer"></div>
        <span id="wx-source" class="pill">—</span>
        <span id="notam-source" class="pill">—</span>
      </header>

      <div id="status-strip" class="status-strip"></div>

      <section class="controls">
        <div class="row">
          <div class="field grow">
            <label for="icaos">Airfields (ICAO, space or comma separated)</label>
            <input id="icaos" type="text" value="KLTS" autocomplete="off" spellcheck="false" />
          </div>
          <div class="field num">
            <label for="xwind">Xwind limit</label>
            <input id="xwind" type="number" value="30" min="1" />
          </div>
          <div class="field num">
            <label for="tailwind">Tailwind</label>
            <input id="tailwind" type="number" value="10" min="1" />
          </div>
          <div class="field num">
            <label for="highda">High DA</label>
            <input id="highda" type="number" value="5000" min="1" step="100" />
          </div>
          <div class="field">
            <label for="agls">Pattern AGL (ft)</label>
            <input id="agls" type="text" value="1500,2500,6000" autocomplete="off" spellcheck="false" title="Comma-separated AGL altitudes for pattern winds" />
          </div>
          <button id="go" class="go">Build Brief</button>
          <button id="print" class="go secondary" title="Print or save as a kneeboard PDF">Kneeboard PDF</button>
          <button id="export-html" class="go secondary" title="Download an interactive, themed HTML copy (collapsible sections preserved)">Export HTML</button>
          <button id="export-pdf" class="go secondary" title="Open a themed copy and print/save as PDF">Export PDF</button>
        </div>
        <div class="row" style="margin-top: 10px; justify-content: space-between;">
          <label class="toggle"><input id="offline" type="checkbox" /> Use offline/demo data</label>
          <div id="quick" class="chips"></div>
        </div>
        <div class="row sortie-row" style="margin-top: 10px;">
          <div class="field grow">
            <label for="sortie-name">Save current setup as a sortie</label>
            <input id="sortie-name" type="text" placeholder="e.g. Altus pattern day" autocomplete="off" />
          </div>
          <button id="sortie-save" class="go secondary">Save</button>
          <div class="field grow">
            <label for="sortie-list">Saved sorties</label>
            <select id="sortie-list"></select>
          </div>
          <button id="sortie-load" class="go secondary">Load</button>
          <button id="sortie-del" class="go secondary" title="Delete selected sortie">Delete</button>
        </div>
      </section>

      <section class="controls tool winds-tool" id="sec-winds">
        <div class="tool-head" data-collapse="sec-winds"><span class="tool-title">Route / Climb Winds</span><span class="chev">▾</span></div>
        <div class="tool-body">
          <div class="row">
            <div class="field grow">
              <label for="winds-points">Airfields or navaids (space or comma separated)</label>
              <input id="winds-points" type="text" value="KCHS KEDW" autocomplete="off" spellcheck="false" />
            </div>
            <button id="winds-go" class="go secondary">Get Winds Aloft</button>
          </div>
          <div id="winds-results"></div>
        </div>
      </section>

      <section class="controls tool mtr-tool" id="sec-mtr">
        <div class="tool-head" data-collapse="sec-mtr"><span class="tool-title">Route Lookup — MTR / AR Track</span><span class="chev">▾</span></div>
        <div class="tool-body">
          <div class="row">
            <div class="field grow">
              <label for="mtr-id">MTR or AR designator (e.g. IR-154, VR-106, AR312H, AR197L)</label>
              <input id="mtr-id" type="text" value="IR-021" autocomplete="off" spellcheck="false" />
            </div>
            <button id="mtr-go" class="go secondary">Look Up Route</button>
          </div>
          <div id="mtr-results"></div>
        </div>
      </section>

      <div id="print-head" class="print-head"></div>

      <section id="map" class="map-section"></section>

      <main id="results">
        <div class="empty">Enter airfields and build a brief.</div>
      </main>

      <footer class="footer">
        Planning aid only — verify with official sources. Limits are user-set placeholders, not -1/TO values.
      </footer>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
