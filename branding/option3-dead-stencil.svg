<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DEAD stencil mark">
  <defs>
    <radialGradient id="bg3" cx="38%" cy="28%" r="95%">
      <stop offset="0%" stop-color="#143b46"/>
      <stop offset="55%" stop-color="#0a1c22"/>
      <stop offset="100%" stop-color="#04090b"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg3)"/>
  <!-- reticle ring framing the mark -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#1c6f80" stroke-width="3" opacity="0.55"/>
  <!-- crosshair: the 'A' of DEAD becomes a target, dot above -->
  <circle cx="256" cy="150" r="40" fill="none" stroke="#22d3ee" stroke-width="7"/>
  <g stroke="#22d3ee" stroke-width="7" stroke-linecap="round">
    <line x1="256" y1="96" x2="256" y2="124"/>
    <line x1="256" y1="176" x2="256" y2="204"/>
    <line x1="202" y1="150" x2="230" y2="150"/>
    <line x1="282" y1="150" x2="310" y2="150"/>
  </g>
  <circle cx="256" cy="150" r="9" fill="#3ddc5a"/>
  <!-- DEAD wordmark, tactical condensed stencil -->
  <g fill="#f4f7fa" font-family="'Arial Narrow', 'Helvetica Neue', Impact, sans-serif" font-weight="800" letter-spacing="6">
    <text x="256" y="320" text-anchor="middle" font-size="118" transform="scale(1,1.06)">DEAD</text>
  </g>
  <!-- runway underline -->
  <line x1="150" y1="356" x2="362" y2="356" stroke="#f4f7fa" stroke-width="8" stroke-dasharray="20 16" stroke-linecap="round" opacity="0.85"/>
  <text x="256" y="404" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace" font-size="34" letter-spacing="10" fill="#22d3ee">MSN PLAN</text>
</svg>
